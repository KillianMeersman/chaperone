rate_limits:
  - url: https://example.com/
    method: GET
    wait_duration: 0.06s # 1000 requests/minute
  - url: https://example.com/posts/
    method: POST
    wait_duration: 0.6s # 100 requests/minute

cache_overrides:
  - url: https://example.com
    min_ttl: 10m
    max_ttl: 1h
    default_ttl: 10m
  - url: https://example.com/posts
    min_ttl: 10m
    max_ttl: 1h
    default_ttl: 20m
