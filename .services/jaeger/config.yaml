service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp/jaeger]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    # metrics:
    #   level: detailed
    #   readers:
    #     - pull:
    #         exporter:
    #           prometheus:
    #             host: 0.0.0.0
    #             port: 8888
    logs:
      level: info
    # TODO Initialize telemetry tracer once OTEL released new feature.
    # https://github.com/open-telemetry/opentelemetry-collector/issues/10663

# ttl:
#   span_store: 72h

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: traces_elasticsearch
      traces_archive: traces_elasticsearch
    ui:
      config_file: ./etc/jaeger/config-ui.json

  jaeger_storage:
    backends:
      traces_elasticsearch:
        elasticsearch:
          server_urls:
            - http://tracing-elasticsearch:9200
          indices:
            # Create a single index per day, with 5 shards per index.
            index_prefix: "jaeger-main"
            spans:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            services:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            dependencies:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            sampling:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
    metric_backends:
      prometheus_storage:
        prometheus:
          endpoint: http://prometheus:9090
          normalize_calls: true
          normalize_duration: true

receivers:
  otlp/jaeger:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: traces_elasticsearch
