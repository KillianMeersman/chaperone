# For reference, see https://grafana.com/docs/loki/latest/configuration/

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

limits_config:
  # Allow user to send structured metadata in push payload.
  # Necessary for OTLP push.
  allow_structured_metadata: true

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

block_builder:
  chunk_target_size: 1MB
  max_chunk_age: 3h

ingester:
  chunk_idle_period: 3h

storage_config:
  filesystem:
    directory: /loki/chunks/

distributor:
  # Promote the following labels coming from OpenTelemetry input to be indexed.
  # Only indexed labels can be filtered on.
  # See https://grafana.com/docs/loki/latest/get-started/labels/#default-labels-for-opentelemetry.
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - environment
      - deploy.environment
      - k8s.pod.name
      - k8s.deployment.name
      - k8s.daemonset.name
      - k8s.statefulset.name
      - k8s.namespace.name
      - k8s.job.name

ruler:
  alertmanager_url: http://localhost:9093
# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/usagestats/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
